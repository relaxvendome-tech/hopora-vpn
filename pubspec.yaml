name: hopora_vpn
description: "Hopora VPN - 50 serveurs VPN gratuits (VPN Gate), VPN integre, 20 langues."
publish_to: 'none'
version: 2.1.0+11

environment:
  sdk: '>=3.4.0 <4.0.0'

# Les versions exactes des paquets sont fixees au moment de la construction
# (flutter pub add dans .github/workflows/build-apk.yml).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 24
