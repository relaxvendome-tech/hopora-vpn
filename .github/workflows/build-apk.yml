name: Construire l'APK Hopora

on:
  push:
    branches: [hopora-vpn]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # "[e2e-only]" dans le message de commit : on relance seulement le test.
    if: ${{ !contains(github.event.head_commit.message, '[e2e-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Vos identifiants AdMob (Settings > Secrets and variables > Actions).
      # Sans secrets, les identifiants de TEST de Google sont utilises.
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generer le dossier Android
        run: flutter create --platforms=android --org com.hopora --project-name hopora_vpn .

      - name: Bibliotheques
        run: |
          flutter pub add http google_mobile_ads openvpn_flutter shared_preferences url_launcher path_provider crypto
          flutter pub add dev:flutter_launcher_icons
          flutter pub get
          grep -A12 "^dependencies:" pubspec.yaml

      - name: Moteur tun2socks du mode Tor (hev-socks5-tunnel)
        run: |
          git clone -q --depth 1 --branch 2.19.1 --recursive --shallow-submodules \
            https://github.com/heiher/hev-socks5-tunnel.git android/app/src/main/jni/hev-socks5-tunnel

      - name: Configurer Android (VPN, discretion, AdMob, icone)
        run: |
          set -o pipefail
          {
            # Icones d'abord : l'outil reecrit les attributs android:icon du manifeste.
            dart run flutter_launcher_icons
            python3 android_templates/patch_android.py
            grep -n "ic_calc\|LauncherCalc" android/app/src/main/AndroidManifest.xml
          } 2>&1 | tee build.log

      - name: Construire
        run: |
          UNIT="${ADMOB_INTERSTITIAL_ID:-ca-app-pub-3940256099942544/1033173712}"
          (while true; do echo "$(date +%T) $(free -m | sed -n 2p)" >> mem.log; sleep 20; done) &
          set -o pipefail
          # Taille : un APK par architecture (au lieu d'un APK universel) et code
          # Dart obfusque, symboles de debogage sortis du paquet.
          OPT="--obfuscate --split-debug-info=build/symbols --dart-define=ADMOB_INTERSTITIAL_ID=$UNIT"
          flutter build apk --release --split-per-abi $OPT 2>&1 | tee -a build.log
          flutter build appbundle --release $OPT 2>&1 | tee -a build.log
          # Version de test (debuggable, x86_64) : seule elle active le test automatique.
          flutter build apk --debug --target-platform android-x64 --dart-define=ADMOB_INTERSTITIAL_ID="$UNIT" 2>&1 | tee -a build.log
          ls -la build/app/outputs/flutter-apk/

      - name: Remonter les erreurs
        if: failure() || cancelled()
        run: |
          touch build.log mem.log
          tail -5 mem.log >> build.log
          { grep -nE "rror|What went wrong|FAILURE|xception|\.dart:[0-9]+|Could not|requires|incompatible" build.log | head -60; echo "----- FIN DU JOURNAL -----"; tail -50 build.log; } > err.txt || true
          MSG=$(sed 's/%/%25/g; s/\r//g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build::${MSG}"

      - name: Deposer l'APK dans la branche hopora-apk
        run: |
          mkdir -p /tmp/out
          D=build/app/outputs/flutter-apk
          cp $D/app-arm64-v8a-release.apk /tmp/out/HoporaVPN-arm64.apk
          cp $D/app-armeabi-v7a-release.apk /tmp/out/HoporaVPN-armv7.apk
          cp $D/app-x86_64-release.apk /tmp/out/HoporaVPN-x86_64.apk
          cp $D/app-debug.apk /tmp/out/HoporaVPN-ci-debug.apk
          cp build/app/outputs/bundle/release/app-release.aab /tmp/out/HoporaVPN-unsigned.aab
          cd /tmp/out
          ls -la
          # GitHub refuse les fichiers de plus de 100 Mo : decoupage en morceaux.
          for f in *.apk *.aab; do
            sha256sum "$f" > "$f.sha256"
            split -b 90m -d "$f" "$f.part"
            rm "$f"
          done
          ls -la
          git init -q -b hopora-apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "APK Hopora VPN ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" hopora-apk

  e2e:
    # Test reel sur un Android virtuel : connexion Tor directe puis Snowflake,
    # confirmee par check.torproject.org. Les captures sont deposees dans la
    # branche hopora-e2e.
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Recuperer l'APK construit (branche hopora-apk)
        run: |
          git clone -q --depth 1 --branch hopora-apk "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" /tmp/apk
          cat /tmp/apk/HoporaVPN-ci-debug.apk.part* > app-ci.apk
          git -C /tmp/apk log -1 --format=%s

      - name: Activer la virtualisation (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "::warning title=KVM::$(ls -l /dev/kvm 2>&1) | $(nproc) CPU | $(free -m | sed -n 2p)"

      - name: Test de bout en bout
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_atd
          channel: canary
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ci/e2e.sh app-ci.apk e2e-out

      - name: Deposer les resultats dans la branche hopora-e2e
        if: always()
        run: |
          mkdir -p e2e-out && cp -r e2e-out /tmp/e2e && cd /tmp/e2e
          git init -q -b hopora-e2e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "E2E ${GITHUB_SHA::7}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" hopora-e2e
