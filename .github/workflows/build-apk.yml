name: Construire l'APK Hopora

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vos identifiants AdMob (Settings > Secrets and variables > Actions).
      # Sans secrets, les identifiants de TEST de Google sont utilises.
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generer le dossier Android
        run: flutter create --platforms=android --org com.hopora --project-name hopora_vpn .

      - name: Configurer Android (Internet, nom, AdMob, minSdk)
        run: |
          APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="hopora_vpn"#android:label="Hopora VPN" android:usesCleartextTraffic="true"#' "$M"
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APP_ID\"/>\n    </application>#" "$M"
          for G in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$G" ] && sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' "$G"
          done
          cat "$M"
          grep -n minSdk android/app/build.gradle* || true

      - name: Bibliotheques a jour
        run: |
          flutter pub add google_mobile_ads
          flutter pub get
          grep google_mobile_ads pubspec.yaml

      - name: Construire
        run: |
          UNIT="${ADMOB_INTERSTITIAL_ID:-ca-app-pub-3940256099942544/1033173712}"
          set -o pipefail
          flutter build apk --release --dart-define=ADMOB_INTERSTITIAL_ID="$UNIT" 2>&1 | tee build.log

      - name: Remonter les erreurs
        if: failure()
        run: |
          { grep -nE "rror|What went wrong|FAILURE|xception|\.dart:[0-9]+|Could not|requires|incompatible" build.log | head -60; echo "----- FIN DU JOURNAL -----"; tail -50 build.log; } > err.txt || true
          MSG=$(sed 's/%/%25/g; s/\r//g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build::${MSG}"

      - uses: actions/upload-artifact@v4
        with:
          name: HoporaVPN-apk
          path: build/app/outputs/flutter-apk/app-release.apk
