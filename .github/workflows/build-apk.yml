name: Construire l'APK Hopora

on:
  push:
    branches: [hopora-vpn]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vos identifiants AdMob (Settings > Secrets and variables > Actions).
      # Sans secrets, les identifiants de TEST de Google sont utilises.
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generer le dossier Android
        run: flutter create --platforms=android --org com.hopora --project-name hopora_vpn .

      - name: Bibliotheques
        run: |
          flutter pub add http google_mobile_ads openvpn_flutter shared_preferences url_launcher
          flutter pub add dev:flutter_launcher_icons
          flutter pub get
          grep -A12 "^dependencies:" pubspec.yaml

      - name: Configurer Android (VPN, discretion, AdMob, icone)
        run: |
          python3 android_templates/patch_android.py
          dart run flutter_launcher_icons
          grep -n minSdk android/app/build.gradle* || true

      - name: Construire
        run: |
          UNIT="${ADMOB_INTERSTITIAL_ID:-ca-app-pub-3940256099942544/1033173712}"
          set -o pipefail
          flutter build apk --release --dart-define=ADMOB_INTERSTITIAL_ID="$UNIT" 2>&1 | tee build.log
          flutter build appbundle --release --dart-define=ADMOB_INTERSTITIAL_ID="$UNIT" 2>&1 | tee -a build.log

      - name: Remonter les erreurs
        if: failure()
        run: |
          touch build.log
          { grep -nE "rror|What went wrong|FAILURE|xception|\.dart:[0-9]+|Could not|requires|incompatible" build.log | head -60; echo "----- FIN DU JOURNAL -----"; tail -50 build.log; } > err.txt || true
          MSG=$(sed 's/%/%25/g; s/\r//g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build::${MSG}"

      - name: Deposer l'APK dans la branche hopora-apk
        run: |
          mkdir -p /tmp/out && cp build/app/outputs/flutter-apk/app-release.apk /tmp/out/HoporaVPN.apk
          cp build/app/outputs/bundle/release/app-release.aab /tmp/out/HoporaVPN-unsigned.aab
          cd /tmp/out
          git init -q -b hopora-apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add HoporaVPN.apk HoporaVPN-unsigned.aab
          git commit -q -m "APK Hopora VPN ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" hopora-apk
